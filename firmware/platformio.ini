[env:xiao_rp2040]
platform = raspberrypi
board = seeed_xiao_rp2040
framework = arduino

; Switches the framework's USB stack from plain CDC-only (Pico SDK) to
; Adafruit TinyUSB, which is what lets us expose a USB MIDI device.
; (This platform reads a literal -DUSE_TINYUSB define, not a
; board_build.usb_stack setting.)
build_flags = -DUSE_TINYUSB

; Adafruit TinyUSB itself is bundled by the framework (enabled by the
; define above) -- do not also add it here, it creates a duplicate-name
; conflict that breaks the include path.
lib_deps =
    FortySevenEffects/MIDI Library
    adafruit/Adafruit NeoPixel

monitor_speed = 115200
